<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b4a2f"><title>Les Saveurs d’Orients — Boutique</title><meta name="description" content="La boutique Les Saveurs d’Orients : produits marocains et huiles cosmétiques."><style>html,body{margin:0;min-height:100%;background:#fff;color:#173126;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}iframe{display:block;width:100%;height:100vh;border:0}body{overflow-x:hidden}</style></head><body><iframe id="shop" src="boutique.html" title="Boutique Les Saveurs d’Orients"></iframe><script>(()=>{const frame=document.getElementById('shop');const oils={68:'huile-jojoba-cosmetique.jpg',69:'huile-moutarde-cosmetique.jpg',70:'huile-figue-barbarie-cosmetique.jpg',71:'huile-coco-cosmetique.jpg'};const css=`.brand-logo{width:58px;height:58px;flex:0 0 58px;object-fit:contain;border-radius:50%;background:#fff;box-shadow:0 3px 12px rgba(11,74,47,.12)}.footer .brand-logo{box-shadow:none}.nav{box-shadow:0 8px 24px rgba(18,57,40,.06)}.nav .container{min-height:82px}.brand strong{letter-spacing:.025em}.brand small{display:block;margin-top:5px;letter-spacing:.12em;color:#68756c}.iconbtn{transition:background .18s ease,color .18s ease,transform .18s ease}.iconbtn:hover{background:#edf5ed;transform:translateY(-1px)}.cartbtn:hover{background:#14643f;color:#fff}.sectionhead h2{letter-spacing:-.025em}.shop{background:linear-gradient(180deg,#f8faf5 0%,#fff 100%)}.filter{transition:all .18s ease}.filter:hover{border-color:var(--green2);color:var(--green)}.card{transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}.card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(18,57,40,.12);border-color:#d5e2d4}.pic.hasimg img[src$="huile-jojoba-cosmetique.jpg"],.pic.hasimg img[src$="huile-moutarde-cosmetique.jpg"],.pic.hasimg img[src$="huile-figue-barbarie-cosmetique.jpg"],.pic.hasimg img[src$="huile-coco-cosmetique.jpg"]{object-fit:contain;background:#f7f5ee;padding:9px}.productmodalgrid img[src$="huile-jojoba-cosmetique.jpg"],.productmodalgrid img[src$="huile-moutarde-cosmetique.jpg"],.productmodalgrid img[src$="huile-figue-barbarie-cosmetique.jpg"],.productmodalgrid img[src$="huile-coco-cosmetique.jpg"]{object-fit:contain;background:#f7f5ee}@media(max-width:560px){.brand-logo{width:44px;height:44px;flex-basis:44px}.nav .container{min-height:68px}.brand small{display:none}}`;
function enhance(){try{const d=frame.contentDocument,w=frame.contentWindow;if(!d||!w.eval('typeof products !== "undefined"'))return;const style=d.createElement('style');style.textContent=css;d.head.appendChild(style);d.querySelectorAll('.brand').forEach(b=>{const mark=b.querySelector('.mark');if(mark){const logo=d.createElement('img');logo.className='brand-logo';logo.src='logo-les-saveurs.jpg';logo.alt='Logo Les Saveurs d’Orients';mark.replaceWith(logo)}});w.eval(`products.forEach(p=>{const imgs=${JSON.stringify(oils)};if(imgs[p.id])p.img=imgs[p.id]});renderCats();renderProducts();updateCart()`);}catch(e){console.warn('Storefront update pending',e)}}frame.addEventListener('load',enhance)})();</script></body></html>
